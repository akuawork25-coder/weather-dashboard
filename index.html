<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">☀️</span>
          <h1>Weather Dashboard</h1>
        </div>

        <form id="search-form" class="search-form">
          <input
            id="city-input"
            type="text"
            placeholder="Search city..."
            aria-label="Search city"
          />
          <button type="submit">Search</button>
        </form>
      </header>

      <main class="dashboard">
        <section class="current-card card">
          <div class="location-row">
            <div>
              <p class="label">Current weather</p>
              <h2 id="city-name">Loading...</h2>
            </div>
            <div id="weather-icon" class="weather-icon" aria-label="Weather icon">⏳</div>
          </div>

          <div class="temp-row">
            <div id="temperature" class="temperature">--°C</div>
            <div class="temperature-meta">
              <div id="condition">--</div>
              <div id="date-time">--</div>
            </div>
          </div>

          <div class="stats-grid">
            <div class="stat">
              <span>Feels like</span>
              <strong id="feels-like">--°C</strong>
            </div>
            <div class="stat">
              <span>Humidity</span>
              <strong id="humidity">--%</strong>
            </div>
            <div class="stat">
              <span>Wind</span>
              <strong id="wind">-- km/h</strong>
            </div>
            <div class="stat">
              <span>Precipitation</span>
              <strong id="precipitation">-- mm</strong>
            </div>
          </div>
        </section>

        <section class="card">
          <div class="section-header">
            <h3>24-Hour Forecast</h3>
          </div>
          <div id="hourly-forecast" class="hourly-forecast"></div>
        </section>

        <section class="card">
          <div class="section-header">
            <h3>7-Day Outlook</h3>
          </div>
          <div id="daily-forecast" class="daily-forecast"></div>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
